<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Go CRM" />
  <title>Go CRM</title>
  <script>
    try {
      var t = localStorage.getItem('go-crm-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Login -->
  <div id="loginView" class="login hidden">
    <form id="loginForm">
      <div class="logo"><b>Go</b> CRM</div>
      <h1>Partner CRM</h1>
      <p>Go Car Rentals &amp; Go Campers · Reykjavík office</p>
      <input class="input" type="password" id="password" placeholder="Password" autocomplete="current-password" required />
      <label class="check"><input type="checkbox" id="remember" checked /> Remember on this device</label>
      <button class="btn" type="submit">Log in</button>
      <div class="error" id="loginError"></div>
    </form>
  </div>

  <!-- App -->
  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <a class="logo" href="#/"><b>Go</b> CRM <span>Reykjavík</span></a>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="sidebar-foot">
        <div class="side-note" id="roleNote"></div>
        <button class="side-btn" type="button" data-action="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="txt">Theme</span></button>
        <button class="side-btn" type="button" data-action="logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="txt">Log out</span></button>
      </div>
    </aside>
    <main>
      <div class="mobile-top">
        <a class="logo" href="#/"><b>Go</b> CRM</a>
        <div class="mobile-top-actions">
          <div class="seg currency-seg"></div>
          <button class="icon-btn round" type="button" data-action="menu" aria-label="Menu">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
          </button>
        </div>
      </div>
      <div class="wrap" id="page"></div>
    </main>
    <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
