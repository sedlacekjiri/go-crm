<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#17181b" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Go CRM" />
  <title>Go CRM</title>
  <script>
    try {
      var t = localStorage.getItem('go-crm-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Login -->
  <div id="loginView" class="login hidden">
    <form id="loginForm">
      <div class="logo"><img src="/logo.png" alt="Go" /><span>CRM · Reykjavík</span></div>
      <h1>Partner CRM</h1>
      <p>Go Car Rentals &amp; Go Campers · Reykjavík office</p>
      <input class="input" type="email" id="email" placeholder="E-mail (admin: optional)" autocomplete="username" />
      <input class="input" type="password" id="password" placeholder="Password" autocomplete="current-password" required />
      <label class="check"><input type="checkbox" id="remember" checked /> Remember on this device</label>
      <button class="btn" type="submit">Log in</button>
      <div class="error" id="loginError"></div>
    </form>
  </div>

  <!-- App -->
  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <a class="logo" href="#/"><img src="/logo.png" alt="Go" /><span>CRM · Reykjavík</span></a>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="sidebar-foot">
        <button class="me-chip" type="button" data-action="profile" id="meChip"></button>
        <button class="side-btn" type="button" data-action="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span class="txt">Edit profile</span></button>
        <button class="side-btn" type="button" data-action="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="txt">Theme</span></button>
        <button class="side-btn" type="button" data-action="team" data-team-only hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></svg><span class="txt">Team</span></button>
        <button class="side-btn" type="button" data-action="logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="txt">Log out</span></button>
      </div>
    </aside>
    <main>
      <div class="topbar">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="searchInput" placeholder="Search partners, tasks, posts…" autocomplete="off" aria-label="Search" />
          <kbd>⌘K</kbd>
          <div class="search-results" id="searchResults" hidden></div>
        </div>
        <div class="topbar-end">
          <div class="seg currency-seg"></div>
          <button class="icon-btn round bell" type="button" data-action="inbox" aria-label="Comments for you"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><em class="bell-count" hidden></em></button>
          <div class="new-menu">
            <button class="btn sm" type="button" data-action="new" aria-haspopup="true" aria-expanded="false">+ New</button>
            <div class="menu-pop" id="newMenu" hidden></div>
          </div>
          <button class="top-me" type="button" data-action="profile" id="topMe" aria-label="Edit profile"></button>
        </div>
      </div>
      <div class="mobile-top">
        <a class="logo" href="#/"><img src="/logo.png" alt="Go" /><span>CRM</span></a>
        <div class="mobile-top-actions">
          <div class="seg currency-seg"></div>
          <button class="icon-btn round bell" type="button" data-action="inbox" aria-label="Comments for you"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><em class="bell-count" hidden></em></button>
          <button class="icon-btn round" type="button" data-action="search" aria-label="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
          <button class="icon-btn round" type="button" data-action="menu" aria-label="Menu">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
          </button>
        </div>
      </div>
      <div class="wrap" id="page"></div>
    </main>
    <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
